name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 10.22.0
  NODE_VERSION: 22

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm lint

  build:
    name: Static build + search index
    needs: quality
    runs-on: ubuntu-latest
    env:
      SITE_BASE: /LX-blog2.0/
      POST_PASSWORD_XIANGTU: ${{ github.event_name == 'pull_request' && 'ci-placeholder' || secrets.POST_PASSWORD_XIANGTU }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm links
      # PR builds use a throwaway passphrase and are never deployed.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Post-deploy smoke test
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check production routes
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl -fsS "$PAGE_URL" | grep -q "夜航档案"
          curl -fsS "${PAGE_URL}guestbook/" | grep -q "留言板"
          curl -fsS "${PAGE_URL}posts/xiangtuzhongguo-analysis/" | grep -qi "noindex\|加密\|password"
          curl -fsS "${PAGE_URL}rss.xml" | grep -q "<rss"
          curl -fsS "${PAGE_URL}sitemap.xml" | grep -q "<urlset"
          curl -fsS "${PAGE_URL}pagefind/pagefind.js" | grep -q "pagefind"
          code=$(curl -s -o /dev/null -w "%{http_code}" "${PAGE_URL}definitely-missing/")
          test "$code" = "404"
          echo "smoke ok: $PAGE_URL"
