name: Lighthouse & a11y

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  PNPM_VERSION: 10.22.0
  NODE_VERSION: 22
  SITE_BASE: /LX-blog2.0/
  BASE_URL: http://127.0.0.1:4321/LX-blog2.0
  EDGE_PATH: /usr/bin/google-chrome

jobs:
  audit:
    name: Lighthouse + axe
    runs-on: ubuntu-latest
    env:
      POST_PASSWORD_XIANGTU: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm links
      - name: Start preview
        run: |
          node scripts/serve.mjs > /tmp/noctilux-serve.log 2>&1 &
          echo $! > /tmp/noctilux-serve.pid
          for i in $(seq 1 20); do
            if curl -fsS "$BASE_URL" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/noctilux-serve.log
          exit 1
      - name: Lighthouse
        run: pnpm audit:lighthouse
      - name: axe
        run: pnpm audit:a11y
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-and-a11y
          path: |
            docs/lighthouse/
            docs/lighthouse-report.md
            docs/lighthouse-summary.json
            docs/a11y-report.json
          if-no-files-found: warn
      - name: Stop preview
        if: always()
        run: kill "$(cat /tmp/noctilux-serve.pid)" || true
